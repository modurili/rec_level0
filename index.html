<style>:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--osd); user-select: none; -webkit-user-select: none; }

/* ---------- camcorder OSD ---------- */
#osd { position: fixed; inset: 0; pointer-events: none; font-family: var(--en); font-size: clamp(20px, 2.6vw, 34px); letter-spacing: .06em; text-shadow: var(--osd-shadow); }
.vf { position: absolute; width: 4.2vw; height: 4.2vw; border-color: rgba(244,241,230,.7); border-style: solid; border-width: 0; }
.vf.tl { left: 4vw; top: 5vh; border-left-width: 2px; border-top-width: 2px; }
.vf.tr { right: 4vw; top: 5vh; border-right-width: 2px; border-top-width: 2px; }
.vf.bl { left: 4vw; bottom: 5vh; border-left-width: 2px; border-bottom-width: 2px; }
.vf.br { right: 4vw; bottom: 5vh; border-right-width: 2px; border-bottom-width: 2px; }
.osd-tl { position: absolute; left: 6.5vw; top: 7vh; line-height: 1.05; }

@keyframes blink { 50% { opacity: 0; } }
.mode { font-size: .8em; opacity: .92; }

.bat-icon::after { content: ""; position: absolute; right: -6px; top: 25%; width: 4px; height: 50%; background: var(--osd); }

.bat-icon i.off { background: transparent; }
.bat-icon.low { animation: blink .6s steps(1) infinite; }
.tag { font-size: .78em; }
.osd-trk { position: absolute; left: 50%; top: 7vh; transform: translateX(-50%); display: flex; gap: .4em; align-items: center; font-size: .72em; opacity: .9; }
.trk { display: inline-flex; gap: 3px; align-items: flex-end; height: .9em; }

.trk i:nth-child(1){height:30%}.trk i:nth-child(2){height:45%}.trk i:nth-child(3){height:60%}.trk i:nth-child(4){height:72%}.trk i:nth-child(5){height:86%}.trk i:nth-child(6){height:100%}
.trk i.on { background: var(--osd); }

.hint.show { opacity: .92; }

/* ---------- VCR menu ---------- */
#menu { position: fixed; inset: 0; background: var(--vcr); color: var(--vcr-hi); font-family: var(--jp); padding: 7vh 9vw 5vh; display: flex; flex-direction: column; gap: 3vh; text-shadow: 2px 2px 0 rgba(0,0,0,.35); cursor: default; }
#menu::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px); }
.m-head { display: flex; justify-content: space-between; font-family: var(--en); font-size: clamp(28px, 3.4vw, 48px); letter-spacing: .1em; border-bottom: 3px solid var(--vcr-hi); padding-bottom: .2em; }
.m-body { display: flex; flex-direction: column; gap: 1.1vh; font-size: clamp(15px, min(1.8vw, 3.2vh), 24px); max-width: 980px; overflow-y: auto; min-height: 0; flex: 1; padding-right: 8px; }
.m-body .mi { color: var(--vcr-hi); text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.m-body .mi:hover, .m-body .mi:focus-visible { color: var(--vcr); background: var(--vcr-hi); text-shadow: none; }
.m-row { display: grid; grid-template-columns: minmax(180px, 16em) 1fr 5em; align-items: center; gap: 1em; }
.m-row input[type=range] { pointer-events: auto; -webkit-appearance: none; appearance: none; height: 10px; background: rgba(255,255,255,.35); outline: none; }
.m-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 22px; background: #fff; cursor: pointer; }

.seg { display: flex; gap: .4em; flex-wrap: wrap; }
.seg button { pointer-events: auto; font-family: var(--jp); font-size: .9em; color: #fff; background: transparent; border: 2px solid #fff; padding: .15em .7em; cursor: pointer; }
.seg button.on { background: #fff; color: var(--vcr); }
.m-text { line-height: 1.7; letter-spacing: .06em; white-space: pre-line; }
.m-keys { display: grid; grid-template-columns: 8em 1fr; gap: .15em 1.4em; line-height: 1.45; }
.m-keys b { font-family: var(--en); font-weight: normal; font-size: 1.25em; letter-spacing: .08em; }
.m-big { font-size: clamp(26px, 3.6vw, 52px); letter-spacing: .2em; }
.m-stats { font-family: var(--en); font-size: 1.3em; line-height: 1.4; letter-spacing: .08em; }

/* ---------- loading / fades ---------- */
#loading { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2vh; font-family: var(--en); font-size: clamp(26px, 3vw, 40px); letter-spacing: .2em; }
.ld-bar { width: min(40vw, 420px); height: 10px; border: 2px solid var(--osd); }
.ld-bar i { display: block; height: 100%; width: 0; background: var(--osd); transition: width .2s; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; }
#clickcatch { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--jp); font-size: clamp(18px, 2vw, 26px); background: rgba(0,0,0,.4); cursor: pointer; letter-spacing: .2em; }

<script id="worker-src" type="text/plain">// =====================================================================
//  REC: LEVEL 0 — world generation worker
//  Zones (not a maze): LOBBY (open plan), PILLARS (tall pillar hall),
//  OFFICES (BSP rooms), CORRIDOR strips (parallel lanes, loopable),
//  VOID (huge dark hall). Bakes a soft-shadowed light field per chunk.
// =====================================================================
'use strict';
const CH = 24, LSP = 3, NL = 8, LSM = 3, LSN = 14;
const LFR = 0.25, LFN = 104;            // light field: 0.25m texels, chunk ±1m
const NAVN = 48;                         // nav grid: 0.5m cells
const ZL = 0, ZP = 1, ZO = 2, ZC = 3, ZV = 4;
const K_WALL = 0, K_PILLAR = 1, K_HEADER = 2, K_PROP = 3;
const M = { WALL: 0, FLOOR: 1, CEIL: 2, PANEL: 3, HOLE: 4, VENT: 5, OUTLET: 6, PUDDLE: 7, CARD: 8, FABRIC: 9, METAL: 10, TILE: 11, WOOD: 12, BASE: 13 };
let SEEDH = 12345;
const variants = new Map();

// ---------- hashing (bit-exact with main thread) ----------
function h32(x) {
  x = x >>> 0;
  x ^= x >>> 16; x = Math.imul(x, 0x7feb352d) >>> 0;
  x ^= x >>> 15; x = Math.imul(x, 0x846ca68b) >>> 0;
  x ^= x >>> 16; return x >>> 0;
}
function hash3(a, b, c) {
  return h32(Math.imul(a | 0, 0x8da6b343) ^ h32(Math.imul(b | 0, 0xd8163841) ^ h32(((c | 0) + SEEDH) | 0)));
}
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const fdiv = (a, b) => Math.floor(a / b);

// ---------- zones ----------
function corridorInfo(cx, cz) {
  const segX = fdiv(cx, 6), segZ = fdiv(cz, 6);
  const hRow = (hash3(cz, 9001, 0) % 5 === 0) && (hash3(cz, segX, 9002) % 100 < 62);
  const vCol = (hash3(cx, 9003, 0) % 6 === 0) && (hash3(cx, segZ, 9004) % 100 < 62);
  if (hRow && vCol) return { junction: true };
  if (hRow) return { axis: 0, strip: cz, seg: segX, idx: cx - segX * 6 };
  if (vCol) return { axis: 1, strip: cx, seg: segZ, idx: cz - segZ * 6 };
  return null;
}
const infoCache = new Map();
function chunkInfo(cx, cz) {
  const k = cx + ',' + cz; let c = infoCache.get(k); if (c) return c;
  c = { cx, cz, zone: ZL, H: 2.8, dark: false, cor: null, low: false, wet: 0 };
  const near = Math.abs(cx) <= 1 && Math.abs(cz) <= 1;
  if (!near) {
    const cor = corridorInfo(cx, cz);
    if (cor && !cor.junction) { c.zone = ZC; c.cor = cor; }
    else if (!cor) {
      const rx = fdiv(cx + 1, 3), rz = fdiv(cz + 1, 3);
      const r = hash3(rx, rz, 77) % 100;
      let z = r < 38 ? ZL : r < 56 ? ZP : r < 81 ? ZO : r < 88 ? ZV : ZL;
      if (hash3(cx, cz, 78) % 100 < 16) z = [ZL, ZO, ZP, ZL][hash3(cx, cz, 81) % 4];
      c.zone = z;
      if ((z === ZL || z === ZO) && (hash3(rx, rz, 79) % 100 < 20 || hash3(cx, cz, 82) % 100 < 7)) c.dark = true;
      if (z === ZL && hash3(rx, rz, 80) % 100 < 25) c.low = true;
    }
  }
  c.H = c.zone === ZL ? (c.low ? 2.45 : 2.8) : c.zone === ZP ? 5.4 : c.zone === ZO ? 2.7 : c.zone === ZC ? 2.6 : 7.5;
  c.wet = c.zone === ZV ? 0.85 : (hash3(cx, cz, 83) % 100) / 100 * 0.55;
  if (near) c.wet = 0.25;
  infoCache.set(k, c);
  if (infoCache.size > 6000) infoCache.clear();
  return c;
}
const OPEN = z => z === ZL || z === ZP || z === ZV;

// edge walls: 'v' edge at x = X*CH between (X-1,Z) and (X,Z); 'h' edge at z = Z*CH between (X,Z-1) and (X,Z)
function edgeSpec(type, X, Z) {
  const A = type === 'v' ? chunkInfo(X - 1, Z) : chunkInfo(X, Z - 1);
  const B = chunkInfo(X, Z);
  const H = Math.max(A.H, B.H);
  if (OPEN(A.zone) && OPEN(B.zone)) return { wall: false, H };
  if (A.zone === ZC && B.zone === ZC && A.cor.axis === B.cor.axis && A.cor.strip === B.cor.strip) {
    if ((A.cor.axis === 0 && type === 'v') || (A.cor.axis === 1 && type === 'h')) return { wall: false, H };
  }
  const r = rng(hash3(X * 3 + (type === 'v' ? 1 : 2), Z, 4242));
  const slots = [0, 1, 2, 3, 4, 5, 6, 7];
  for (let i = 7; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
  const n = 2 + Math.floor(r() * 3);
  const open = [];
  for (let i = 0; i < n; i++) { const c = 1.5 + 3 * slots[i]; const w = r() < 0.2 ? 2.4 : 1.5; open.push([c - w / 2, c + w / 2]); }
  open.sort((a, b) => a[0] - b[0]);
  return { wall: true, H, open, header: A.zone === ZO || B.zone === ZO };
}

// ---------- layout ----------
const layoutCache = new Map();
function vkey(cx, cz) { return cx + ',' + cz; }
function layout(cx, cz) {
  const v = variants.get(vkey(cx, cz)) || 0;
  const key = cx + ',' + cz + ',' + v;
  let L = layoutCache.get(key); if (L) return L;
  const info = chunkInfo(cx, cz);
  const X0 = cx * CH, Z0 = cz * CH;
  const r = rng(hash3(cx, cz, 1000 + v * 31));
  L = { cx, cz, info, X0, Z0, v, boxes: [], lstate: new Uint8Array(64), lint: new Uint8Array(64), rot: 0,
        props: [], holes: [], puddles: [], vents: [], outlets: [], rooms: [], darkRooms: [] };
  addEdge(L, 'v'); addEdge(L, 'h');
  const eg = { h: new Uint8Array(49 * 48), v: new Uint8Array(49 * 48) };
  const H = info.H;
  if (info.zone === ZL) genLobby(L, eg, r);
  else if (info.zone === ZO) genOffices(L, eg, r);
  else if (info.zone === ZC) genCorridor(L, eg);
  else if (info.zone === ZP) genPillars(L, r);
  else genVoid(L, r);
  latticeBoxes(L, eg, H);
  genLights(L);
  genProps(L, r);
  layoutCache.set(key, L);
  if (layoutCache.size > 400) { const it = layoutCache.keys(); for (let i = 0; i < 100; i++) layoutCache.delete(it.next().value); }
  return L;
}

function pushBox(L, x0, z0, x1, z1, y0, y1, kind) { L.boxes.push([Math.min(x0, x1), Math.min(z0, z1), Math.max(x0, x1), Math.max(z0, z1), y0, y1, kind]); }

function addEdge(L, type) {
  const e = edgeSpec(type, L.cx, L.cz); if (!e.wall) return;
  const { X0, Z0 } = L;
  let pos = 0; const segs = [];
  for (const [a, b] of e.open) { if (a > pos) segs.push([pos, a]); pos = Math.max(pos, b); }
  if (pos < CH) segs.push([pos, CH]);
  for (const [a0, b0] of segs) {
    const a = a0 === 0 ? -0.1 : a0, b = b0 === CH ? CH + 0.1 : b0;
    if (type === 'v') pushBox(L, X0 - 0.1, Z0 + a, X0 + 0.1, Z0 + b, 0, e.H, K_WALL);
    else pushBox(L, X0 + a, Z0 - 0.1, X0 + b, Z0 + 0.1, 0, e.H, K_WALL);
  }
  if (e.header) for (const [a, b] of e.open) {
    if (type === 'v') pushBox(L, X0 - 0.1, Z0 + a, X0 + 0.1, Z0 + b, 2.15, e.H, K_HEADER);
    else pushBox(L, X0 + a, Z0 - 0.1, X0 + b, Z0 + 0.1, 2.15, e.H, K_HEADER);
  }
}

function markH(eg, z, xa, xb, val = 1) {
  const j = Math.round(z / 0.5); if (j < 1 || j > 47) return;
  const a = Math.max(0, Math.round(Math.min(xa, xb) / 0.5)), b = Math.min(48, Math.round(Math.max(xa, xb) / 0.5));
  for (let i = a; i < b; i++) eg.h[j * 48 + i] = val;
}
function markV(eg, x, za, zb, val = 1) {
  const i = Math.round(x / 0.5); if (i < 1 || i > 47) return;
  const a = Math.max(0, Math.round(Math.min(za, zb) / 0.5)), b = Math.min(48, Math.round(Math.max(za, zb) / 0.5));
  for (let j = a; j < b; j++) eg.v[i * 48 + j] = val;
}
function seg(eg, horiz, line, a, b, val = 1) { if (horiz) markH(eg, line, a, b, val); else markV(eg, line, a, b, val); }

function latticeBoxes(L, eg, H) {
  const { X0, Z0 } = L;
  for (let j = 1; j < 48; j++) {
    let i = 0;
    while (i < 48) {
      if (eg.h[j * 48 + i]) { const s = i; while (i < 48 && eg.h[j * 48 + i]) i++;
        pushBox(L, X0 + s * 0.5 - 0.1, Z0 + j * 0.5 - 0.1, X0 + i * 0.5 + 0.1, Z0 + j * 0.5 + 0.1, 0, H, K_WALL);
      } else i++;
    }
  }
  for (let i = 1; i < 48; i++) {
    let j = 0;
    while (j < 48) {
      if (eg.v[i * 48 + j]) { const s = j; while (j < 48 && eg.v[i * 48 + j]) j++;
        pushBox(L, X0 + i * 0.5 - 0.1, Z0 + s * 0.5 - 0.1, X0 + i * 0.5 + 0.1, Z0 + j * 0.5 + 0.1, 0, H, K_WALL);
      } else j++;
    }
  }
}

function genLobby(L, eg, r) {
  const n = 9 + Math.floor(r() * 7);
  const line3 = () => 3 * (1 + Math.floor(r() * 7));
  const lineAny = () => (r() < 0.78 ? line3() : 1.5 + 3 * Math.floor(r() * 8));
  for (let k = 0; k < n; k++) {
    const horiz = r() < 0.5;
    const c = lineAny();
    const s = 1.5 * Math.floor(r() * 14);
    const len = 1.5 * (2 + Math.floor(r() * 5));
    const e = Math.min(24, s + len);

// =====================================================================
//  Procedural textures (generated on canvas at startup)
// =====================================================================
const TEX = {};

function periodicValueNoise(size, period, seed) {
  const r = mulberry(seed); const lat = new Float32Array(period * period);
  for (let i = 0; i < lat.length; i++) lat[i] = r();
  const out = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    const fy = y / size * period; const j0 = Math.floor(fy) % period, j1 = (j0 + 1) % period; let ty = fy - Math.floor(fy); ty = ty * ty * (3 - 2 * ty);
    for (let x = 0; x < size; x++) {
      const fx = x / size * period; const i0 = Math.floor(fx) % period, i1 = (i0 + 1) % period; let tx = fx - Math.floor(fx); tx = tx * tx * (3 - 2 * tx);
      const a = lat[j0 * period + i0], b = lat[j0 * period + i1], c = lat[j1 * period + i0], d = lat[j1 * period + i1];
      out[y * size + x] = (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
    }
  }
  return out;
}
function periodicFbm(size, period, oct, seed, gain = 0.5) {
  const out = new Float32Array(size * size); let amp = 1, tot = 0;
  for (let o = 0; o < oct; o++) {
    const n = periodicValueNoise(size, period << o, seed + o * 101);
    for (let i = 0; i < out.length; i++) out[i] += n[i] * amp;
    tot += amp; amp *= gain;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}
function normalFromHeight(h, w, hgt, strength) {
  const data = new Uint8Array(w * hgt * 4);
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    const xl = (x - 1 + w) % w, xr = (x + 1) % w, yu = (y - 1 + hgt) % hgt, yd = (y + 1) % hgt;
    const dx = (h[y * w + xr] - h[y * w + xl]) * strength, dy = (h[yd * w + x] - h[yu * w + x]) * strength;
    let nx = -dx, ny = -dy, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const o = (y * w + x) * 4;
    data[o] = (nx * 0.5 + 0.5) * 255; data[o + 1] = (ny * 0.5 + 0.5) * 255; data[o + 2] = (nz * 0.5 + 0.5) * 255; data[o + 3] = 255;
  }
  return data;
}
function dataTex(data, w, h, srgb, repeat = true) {
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.UnsignedByteType);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8; t.flipY = false; t.needsUpdate = true;
  return t;
}
function canvasPixels(draw, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true }); draw(g, w, h);
  return g.getImageData(0, 0, w, h).data;
}

function genWallpaper() {
  const S = 1024;
  // pattern layer (in grayscale "ink" amount) drawn with canvas
  const ink = canvasPixels((g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    const col = S / 8;
    for (let k = 0; k < 8; k++) {
      const x0 = k * col;
      g.fillStyle = 'rgb(150,0,0)'; g.fillRect(x0 + 2, 0, 3, S); g.fillRect(x0 + 12, 0, 2, S);
      g.fillStyle = 'rgb(70,0,0)'; g.fillRect(x0 + 7, 0, 1, S);
      // repeating chevron motif between the stripes
      for (let m = 0; m < 8; m++) {
        const cx = x0 + col * 0.58, cy = m * (S / 8) + (k % 2) * (S / 16) + S / 16;
        g.strokeStyle = 'rgb(110,0,0)'; g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(cx - 13, cy - 9); g.lineTo(cx, cy + 4); g.lineTo(cx + 13, cy - 9); g.stroke();
        g.beginPath(); g.moveTo(cx - 13, cy + 3); g.lineTo(cx, cy + 16); g.lineTo(cx + 13, cy + 3); g.stroke();
        g.fillStyle = 'rgb(120,0,0)'; g.beginPath(); g.arc(cx, cy - 14, 2.4, 0, 7); g.fill();
      }
    }
    // roll seams
    g.fillStyle = 'rgb(255,0,0)'; g.fillRect(0, 0, 1, S); g.fillRect(S / 2, 0, 1, S);
  }, S, S);
  const fine = periodicFbm(S, 64, 3, 11, 0.55), coarse = periodicFbm(S, 8, 3, 12);
  const col = new Uint8Array(S * S * 4), hgt = new Float32Array(S * S);
  const base = [205, 186, 112];
  for (let i = 0; i < S * S; i++) {
    const a = ink[i * 4] / 255;
    const n = (fine[i] - 0.5) * 0.09 + (coarse[i] - 0.5) * 0.07 + (Math.random() - 0.5) * 0.035;
    const k = (1 - a * 0.16) * (1 + n);
    col[i * 4] = clamp(base[0] * k * (1 - a * 0.03), 0, 255);
    col[i * 4 + 1] = clamp(base[1] * k, 0, 255);
    col[i * 4 + 2] = clamp(base[2] * k * (1 - a * 0.1), 0, 255);
    col[i * 4 + 3] = 255;
    hgt[i] = a * 0.6 + fine[i] * 0.35 + coarse[i] * 0.3;
  }
  TEX.wall = dataTex(col, S, S, true);
  TEX.wallN = dataTex(normalFromHeight(hgt, S, S, 1.4), S, S, false);
}

function genCarpet() {
  const S = 512;
  const n1 = periodicFbm(S, 128, 2, 21), n2 = periodicFbm(S, 16, 3, 22), n3 = periodicFbm(S, 4, 2, 23);
  const col = new Uint8Array(S * S * 4), hgt = new Float32Array(S * S);
  const base = [150, 130, 84];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x;
    const fiber = Math.random();
    const loop = Math.sin((y / S) * Math.PI * 2 * 96) * 0.5 + 0.5;
    const tuft = Math.sin((x / S) * Math.PI * 2 * 96 + Math.sin(y * 0.3) * 0.6) * 0.5 + 0.5;
    const h = fiber * 0.45 + n1[i] * 0.35 + loop * tuft * 0.25;
    const k = 0.78 + h * 0.32 + (n2[i] - 0.5) * 0.16 + (n3[i] - 0.5) * 0.08;
    col[i * 4] = clamp(base[0] * k, 0, 255); col[i * 4 + 1] = clamp(base[1] * k * (0.98 + n2[i] * 0.04), 0, 255); col[i * 4 + 2] = clamp(base[2] * k * (0.95 + n1[i] * 0.08), 0, 255); col[i * 4 + 3] = 255;
    hgt[i] = h;
  }
  TEX.carpet = dataTex(col, S, S, true);
  TEX.carpetN = dataTex(normalFromHeight(hgt, S, S, 1.6), S, S, false);
}

function genCeiling() {
  const S = 1024; const T = S / 2; const bar = 10;
  const r = mulberry(31);
  const ink = canvasPixels((g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    // fissures (short wandering marks)
    for (let k = 0; k < 2600; k++) {
      let x = r() * S, y = r() * S; const len = 2 + r() * 9; let a = r() * 6.28;
      g.strokeStyle = `rgb(${120 + r() * 120 | 0},0,0)`; g.lineWidth = 0.8 + r() * 1.4; g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < len; s++) { a += (r() - 0.5) * 1.4; x += Math.cos(a) * 1.6; y += Math.sin(a) * 1.6; g.lineTo(x, y); }
      g.stroke();
    }
    for (let k = 0; k < 5000; k++) { g.fillStyle = `rgb(${90 + r() * 120 | 0},0,0)`; g.fillRect(r() * S, r() * S, 1.2, 1.2); }
  }, S, S);
  const nn = periodicFbm(S, 16, 3, 32);
  const col = new Uint8Array(S * S * 4), hgt = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x;
    const tx = x % T, ty = y % T;
    const dEdge = Math.min(tx, ty, T - tx, T - ty);
    const isBar = dEdge < bar / 2;
    let c, h;
    if (isBar) { const sh = dEdge < 1.5 ? 0.82 : 1.0; c = [196 * sh, 193 * sh, 182 * sh]; h = 0.0; }
    else {
      const bevel = smooth(bar / 2, bar / 2 + 6, dEdge);
      const a = ink[i * 4] / 255; const k = (1 - a * 0.32) * (0.94 + nn[i] * 0.1) * (0.86 + 0.14 * bevel);
      c = [224 * k, 218 * k, 198 * k]; h = 0.35 + bevel * 0.4 - a * 0.25;
    }
    col[i * 4] = c[0]; col[i * 4 + 1] = c[1]; col[i * 4 + 2] = c[2]; col[i * 4 + 3] = 255; hgt[i] = h;
  }
  TEX.ceil = dataTex(col, S, S, true);
  TEX.ceilN = dataTex(normalFromHeight(hgt, S, S, 3.0), S, S, false);
}

function genPanel() {
  const W = 256, H = 128; const data = new Uint8Array(W * H * 4); const f = 7;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4; const e = Math.min(x, y, W - 1 - x, H - 1 - y);
    if (e < f) { const s = e < 2 ? 0.7 : 0.92; data[o] = 185 * s; data[o + 1] = 184 * s; data[o + 2] = 178 * s; data[o + 3] = 0; continue; }
    const cx = (x - f) % 8, cy = (y - f) % 8;
    const prism = (cx < 1 || cy < 1) ? 0.86 : 0.95 + ((cx + cy) % 3) * 0.025;
    const ends = smooth(f, f + 40, x) * smooth(f, f + 40, W - x);
    const v = prism * (0.86 + ends * 0.14);
    data[o] = 250 * v; data[o + 1] = 247 * v; data[o + 2] = 236 * v; data[o + 3] = 255 * (0.82 + 0.18 * ends);
  }
  const t = dataTex(data, W, H, true, false); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; TEX.panel = t;
}

function genNoise() {
  const S = 256; const a = periodicFbm(S, 4, 4, 41), b = periodicFbm(S, 8, 4, 42), c = periodicFbm(S, 16, 3, 43), d = periodicFbm(S, 32, 2, 44);
  const data = new Uint8Array(S * S * 4);
  for (let i = 0; i < S * S; i++) { data[i * 4] = a[i] * 255; data[i * 4 + 1] = b[i] * 255; data[i * 4 + 2] = c[i] * 255; data[i * 4 + 3] = d[i] * 255; }
  TEX.noise = dataTex(data, S, S, false);
}

function genAllTextures() { genNoise(); genWallpaper(); genCarpet(); genCeiling(); genPanel(); }

// =====================================================================
//  Shaders
// =====================================================================
const GLSL_COMMON = /* glsl */`
uniform float uTime; uniform vec3 uCam;
uniform vec3 uFlPos; uniform vec3 uFlDir; uniform float uFlOn; uniform float uIR;
uniform vec3 uFogCol; uniform float uFogDen;
vec3 applyFog(vec3 c, float d){ float f = 1.0 - exp(-pow(uFogDen * d, 2.0)); return mix(c, uFogCol, f); }
// handheld flashlight with a slightly uneven beam (rings) + IR illuminator for night vision
vec3 flashLight(vec3 P, vec3 N, out vec3 Ldir, out float amt){
  vec3 L = uFlPos - P; float d = length(L); Ldir = L / max(d, 1e-4);
  float cs = dot(-Ldir, uFlDir);
  float spot = smoothstep(0.80, 0.93, cs);
  float ring = 0.93 + 0.07 * sin(acos(clamp(cs, -1.0, 1.0)) * 42.0) * smoothstep(0.995, 0.93, cs);
  float hot = 1.0 + 0.6 * smoothstep(0.975, 0.995, cs);
  float att = 1.0 / (1.0 + 0.06 * d * d);
  float ndl = max(dot(N, Ldir), 0.0);
  amt = uFlOn * 2.3 * spot * ring * hot * att;
  float ir = uIR * 0.9 * smoothstep(0.3, 0.85, cs) / (1.0 + 0.05 * d * d);
  return vec3((amt + ir) * ndl);
}
`;

const ENV_VERT = /* glsl */`
in vec4 aInfo;
out vec3 vW; out vec3 vN; out vec2 vUV;
flat out int vMat; flat out int vLid;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vW = w.xyz; vN = normal; vUV = aInfo.zw;
  vMat = int(aInfo.x + 0.5); vLid = int(aInfo.y + 0.5);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

const ENV_FRAG = /* glsl */`
precision highp float; precision highp int; precision highp sampler2DArray;
out highp vec4 fragColor;
uniform sampler2DArray uLF;
uniform sampler2D uLS;
uniform sampler2D tWall, tWallN, tCarpet, tCarpetN, tCeil, tCeilN, tPanel, tNoise;
uniform vec2 uOrigin; uniform vec2 uLOrigin; uniform float uH; uniform float uRot; uniform float uWet; uniform float uZone;
uniform float uWarp; uniform float uRestMul;
${GLSL_COMMON}
in vec3 vW; in vec3 vN; in vec2 vUV;
flat in int vMat; flat in int vLid;

int pmod3(int a){ return a - 3 * int(floor(float(a) / 3.0)); }
vec2 LS(ivec2 g){ ivec2 l = clamp(g - ivec2(uLOrigin), ivec2(0), ivec2(13)); vec4 t = texelFetch(uLS, l, 0); return vec2(t.r * 2.0, t.g * 255.0); }
float LI(ivec2 g){ return LS(g).x; }
float noiseT(vec2 p, int c){ vec4 n = texture(tNoise, p); return c==0?n.r:(c==1?n.g:(c==2?n.b:n.a)); }

float sceneLight(vec2 p, out float ao){
  vec2 uv = (p - uOrigin + 1.0) / 26.0;
  vec4 A = texture(uLF, vec3(uv, 0.0)); vec4 B = texture(uLF, vec3(uv, 1.0)); vec4 C = texture(uLF, vec3(uv, 2.0));
  ivec2 ce = ivec2(floor(p / 3.0));
  float L = 0.0;
  for (int dj = -1; dj <= 1; dj++) for (int di = -1; di <= 1; di++) {
    ivec2 g = ce + ivec2(di, dj);
    int s = pmod3(g.x) + 3 * pmod3(g.y);
    float v = s < 4 ? A[s] : (s < 8 ? B[s - 4] : C.r);
    L += v * LI(g);
  }
  L += C.g * 3.0 * uRestMul;
  ao = C.b;
  return L;
}
float aoAt(vec2 p){ vec2 uv = (p - uOrigin + 1.0) / 26.0; return texture(uLF, vec3(uv, 2.0)).b; }

vec3 nmap(sampler2D t, vec2 uv, vec3 T, vec3 Bt, vec3 N, float k){ vec3 n = texture(t, uv).xyz * 2.0 - 1.0; n.xy *= k; return normalize(T * n.x + Bt * n.y + N * n.z); }

void main(){
  vec3 N = normalize(vN);
  vec3 Vv = uCam - vW; float dist = length(Vv); vec3 V = Vv / dist;
  int m = vMat;
  vec3 alb = vec3(0.5); vec3 Np = N; float wet = 0.0; vec3 emis = vec3(0.0);
  vec2 lp = vW.xz; float hf = 1.0; float aoMul = 1.0; float lightMul = 1.0; bool lit = true; float gloss = 0.0;

  if (m == 0 || m == 13) { // wallpaper
    bool ax = abs(N.x) > 0.5;
    float u = ax ? vW.z : vW.x; float v = vW.y;
    if (uWarp > 0.001) { u += uWarp * 0.07 * sin(v * 2.3 + uTime * 0.9 + u * 0.6); v += uWarp * 0.05 * sin(u * 1.9 + uTime * 0.7); }
    vec2 uvw = vec2(u, v) / 1.06;
    alb = texture(tWall, uvw).rgb;
    float n1 = noiseT(vec2(u, v) * 0.045 + vec2(0.31, 0.17), 0);
    float n2 = noiseT(vec2(u * 0.11, v * 0.09) + 0.5, 1);
    float n3 = noiseT(vec2(u * 0.6, v * 0.05), 2);
    alb *= mix(0.84, 1.07, n1);
    // water damage creeping up from the floor
    float dmgH = 0.25 + 0.75 * n2;
    float dmg = smoothstep(dmgH, 0.0, v) * smoothstep(0.35, 0.7, n2 + n3 * 0.3);
    alb = mix(alb, alb * vec3(0.62, 0.52, 0.33), dmg * 0.85);
    // tide line
    alb *= 1.0 - 0.35 * smoothstep(0.02, 0.0, abs(v - dmgH)) * smoothstep(0.45, 0.7, n2);
    // brown drip streaks from the ceiling
    float st = smoothstep(0.66, 0.9, noiseT(vec2(u * 1.7, 0.37), 3)) * smoothstep(uH - 1.8 - n1, uH, v);
    alb = mix(alb, alb * vec3(0.7, 0.6, 0.42), st * 0.6);
    vec3 T = ax ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);
    Np = nmap(tWallN, uvw, T, vec3(0.0, 1.0, 0.0), N, 0.8);
    // vinyl baseboard
    if (v < 0.1) { alb = vec3(0.27, 0.22, 0.14) * (0.9 + 0.2 * n1); Np = N; if (v > 0.088) alb *= 1.25; gloss = 0.25; }
    hf = mix(0.6, 1.2, pow(clamp(v / uH, 0.0, 1.0), 1.25));
    lp = vW.xz + N.xz * 0.18;
    float corner = smoothstep(0.08, 0.36, aoAt(vW.xz + N.xz * 0.55));
    aoMul = mix(0.55, 1.0, corner) * mix(0.55, 1.0, smoothstep(0.0, 0.55, v)) * mix(0.75, 1.0, smoothstep(0.0, 0.35, uH - v));
  }
  else if (m == 1 || m == 7) { // carpet (+ puddles)
    vec2 uv = vW.xz;
    alb = texture(tCarpet, uv * 1.333).rgb;
    float n1 = noiseT(uv * 0.06, 0), n2 = noiseT(uv * 0.17 + 0.3, 1), n3 = noiseT(uv * 0.5, 2);
    alb *= mix(0.78, 1.08, n1) * mix(0.92, 1.05, n3);
    float stain = smoothstep(0.62, 0.78, n2) * 0.5 + smoothstep(0.72, 0.8, noiseT(uv * 0.33 + 0.7, 3)) * 0.35;
    alb *= 1.0 - stain * 0.45;
    wet = smoothstep(0.55, 0.75, noiseT(uv * 0.035 + 0.13, 1) * 0.7 + n1 * 0.3) * uWet;
    if (m == 7) {
      float r = length(vUV) + (noiseT(uv * 0.4 + float(vLid) * 0.13, 2) - 0.5) * 0.7;
      wet = max(wet, smoothstep(1.0, 0.55, r));
    }
    Np = nmap(tCarpetN, uv * 1.333, vec3(1.0, 0.0, 0.0), vec3(0.0, 0.0, 1.0), N, 1.0 - wet * 0.8);
    alb *= mix(1.0, 0.5, wet);
    gloss = wet;
    float ao; // AO from wall proximity
    aoMul = 1.0;
    lp = vW.xz;
  }
  else if (m == 2 || m == 11) { // ceiling tiles (11: fallen tile on the floor)
    vec2 uv = m == 2 ? (uRot < 0.5 ? vec2(vW.x - 0.3, vW.z) : vec2(vW.x, vW.z - 0.3)) / 1.2 : vUV * 0.5;
    alb = texture(tCeil, uv).rgb;
    float n1 = noiseT(vW.xz * 0.05 + 0.2, 0), n2 = noiseT(vW.xz * 0.12, 2);
    float ring = smoothstep(0.6, 0.66, n2) * (1.0 - smoothstep(0.7, 0.8, n2));
    float stain = smoothstep(0.62, 0.8, n2);
    alb = mix(alb, alb * vec3(0.78, 0.66, 0.42), stain * 0.6 * smoothstep(0.3, 0.7, n1));
    alb *= 1.0 - ring * 0.25 * smoothstep(0.3, 0.7, n1);
    alb *= mix(0.88, 1.03, n1);
    if (m == 2) {
      Np = nmap(tCeilN, uv, vec3(1.0, 0.0, 0.0), vec3(0.0, 0.0, 1.0), N, 1.0);
      lightMul = 0.0; // ceiling handled below
    } else { Np = N; lp = vW.xz; }
  }
  else if (m == 3) { // light panel
    ivec2 g = ivec2(uLOrigin) + ivec2(vLid % 14, vLid / 14);
    vec2 ls = LS(g);
    vec4 pt = texture(tPanel, vUV);
    float I = ls.x;
    vec3 tubeCol = ls.y > 3.5 ? vec3(1.0, 0.84, 0.58) : vec3(1.0, 0.965, 0.86);
    if (I > 0.001) { emis = tubeCol * I * 3.4 * pt.a * pt.rgb; alb = pt.rgb * 0.7; }
    else { alb = pt.rgb * vec3(0.56, 0.55, 0.52) * (0.8 + 0.2 * smoothstep(0.0, 0.25, abs(vUV.x - 0.5))); }
    lightMul = 0.0;
  }
  else if (m == 4) { // missing ceiling tile: darkness
    alb = vec3(0.006); lit = false;
    emis = vec3(0.002, 0.0018, 0.001) * (1.0 - length(vUV) * 0.5);
  }
  else if (m == 5) { // vent grille
    vec2 uv = vUV; float fr = step(0.08, uv.x) * step(uv.x, 0.92) * step(0.12, uv.y) * step(uv.y, 0.88);
    float sl = step(0.45, fract(uv.y * 7.0));
    alb = mix(vec3(0.5, 0.48, 0.42), mix(vec3(0.02), vec3(0.42, 0.4, 0.35), sl), fr);
    lp = vW.xz + N.xz * 0.2; hf = 1.1;
  }
  else if (m == 6) { // wall outlet

const OBJ_VERT = /* glsl */`
uniform float uJitter; uniform float uTime;

    uGain: { value: 1 }, uNV: { value: 0 }, uInterf: { value: 0 }, uWarp: { value: 0 }, uFx: { value: 1 },

uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime;
uniform float uGain, uNV, uInterf, uWarp, uFx, uBlack, uStatic, uShock, uWhite, uLowBat;
in vec2 vUv;
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  vec2 c = uv - 0.5;

  float r2 = dot(c, c);

// =====================================================================
//  World streaming: chunks, light states, collision, line of sight, nav
// =====================================================================
class World {
  constructor(scene) {
    this.scene = scene;
    this.chunks = new Map();
    this.pending = new Map();
    this.variants = new Map();
    this.loadRadius = 2;
    this.workers = [];
    this.busy = [];
    this.queue = [];
    this.reqId = 1;
    this.onChunk = null;
    this.workerSrc = document.getElementById('worker-src').textContent;
    const url = URL.createObjectURL(new Blob([this.workerSrc], { type: 'text/javascript' }));
    const n = clamp((navigator.hardwareConcurrency || 4) - 1, 2, 4);
    this.gotMsg = false;
    for (let i = 0; i < n; i++) {
      let w;
      try { w = new Worker(url); } catch (e) { w = null; }
      if (!w) { this._goInline(); break; }
      w.onmessage = (e) => { this.gotMsg = true; this._onMsg(i, e.data); };
      w.onerror = (e) => { console.warn('worker failed, generating on the main thread', e.message); if (!this.gotMsg) this._goInline(); };
      w.postMessage({ type: 'init', seed: SEED });
      this.workers.push(w); this.busy.push(0);
    }

      tWall: { value: TEX.wall }, tWallN: { value: TEX.wallN }, tCarpet: { value: TEX.carpet }, tCarpetN: { value: TEX.carpetN },
      tCeil: { value: TEX.ceil }, tCeilN: { value: TEX.ceilN }, tPanel: { value: TEX.panel }, tNoise: { value: TEX.noise },

  update(px, pz, t) {

  entityStep(pos, heavy) {

  }

// =====================================================================
//  Player: first-person camcorder operator
// =====================================================================
const Input = {
  keys: new Set(), mdx: 0, mdy: 0, locked: false, pressed: new Set(),
  init(canvas) {
    addEventListener('keydown', (e) => {
      if (e.repeat) return;
      this.keys.add(e.code); this.pressed.add(e.code);
      if (['Space', 'Tab', 'ControlLeft'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousemove', (e) => { if (this.locked) { this.mdx += e.movementX; this.mdy += e.movementY; } });
    addEventListener('mousedown', (e) => { if (this.locked && e.button === 0) this.pressed.add('Mouse0'); });
    document.addEventListener('pointerlockchange', () => { this.locked = document.pointerLockElement === canvas; if (this.onLockChange) this.onLockChange(this.locked); });
  },
  lock(canvas) {
    try { const p = canvas.requestPointerLock({ unadjustedMovement: true }); if (p && p.catch) p.catch(() => { try { canvas.requestPointerLock(); } catch (e) { } }); }
    catch (e) { try { canvas.requestPointerLock(); } catch (e2) { } }
  },
  down(c) { return this.keys.has(c); },
  hit(c) { return this.pressed.has(c); },
  endFrame() { this.pressed.clear(); this.mdx = 0; this.mdy = 0; },
};

class Player {
  constructor(camera, world) {
    this.cam = camera; this.world = world;
    this.pos = new THREE.Vector3(1.5, 0, 1.5);
    this.vel = new THREE.Vector2();
    this.yaw = 0; this.pitch = 0; this.vYaw = 0; this.vPitch = 0;
    this.radius = 0.3;
    this.eye = 1.62; this.crouchT = 0;
    this.stamina = 1; this.exhausted = false; this.staminaDelay = 0;
    this.battery = 1; this.flash = false; this.nv = false;
    this.sanity = 1;
    this.stepPhase = 0; this.lastStepSide = 0;
    this.moving = 0; this.running = false; this.crouching = false;
    this.noise = 0; // current noise radius for the entity
    this.shake = 0; this.fear = 0;
    this.t = 0; this.distance = 0;
    this.frozen = false;
    this.onStep = null;
    this.forcedLook = null; // {x,y,z, k}
    this.introT = 0;
  }
  reset(x, z, yaw) {
    this.pos.set(x, 0, z); this.vel.set(0, 0); this.yaw = this.vYaw = yaw; this.pitch = this.vPitch = 0;
    this.stamina = 1; this.exhausted = false; this.forcedLook = null; this.frozen = false; this.crouchT = 0;
  }
  update(dt, ctl) {
    this.t += dt;
    const S = Settings;
    // ---- look ----
    if (!this.frozen) {
      const k = 0.0022 * S.sens;
      this.yaw -= Input.mdx * k;
      this.pitch -= Input.mdy * k * (S.invertY ? -1 : 1);
      this.pitch = clamp(this.pitch, -1.45, 1.45);
    }
    // ---- move ----
    let fx = 0, fz = 0;
    if (!this.frozen) {
      if (Input.down('KeyW') || Input.down('ArrowUp')) fz -= 1;
      if (Input.down('KeyS') || Input.down('ArrowDown')) fz += 1;
      if (Input.down('KeyA') || Input.down('ArrowLeft')) fx -= 1;
      if (Input.down('KeyD') || Input.down('ArrowRight')) fx += 1;
    }
    const wantMove = fx !== 0 || fz !== 0;
    this.crouching = !this.frozen && (Input.down('KeyC') || Input.down('ControlLeft'));
    const wantRun = !this.frozen && (Input.down('ShiftLeft') || Input.down('ShiftRight')) && wantMove && fz <= 0 && !this.crouching;
    this.running = wantRun && !this.exhausted && this.stamina > 0.02;
    let speed = this.crouching ? 1.25 : this.running ? 4.9 : 2.3;
    if (this.exhausted) speed *= 0.86;
    if (ctl && ctl.speedMul) speed *= ctl.speedMul;
    const len = Math.hypot(fx, fz) || 1; fx /= len; fz /= len;
    const s = Math.sin(this.yaw), c = Math.cos(this.yaw);
    const tx = (fx * c + fz * s) * speed * (wantMove ? 1 : 0), tz = (-fx * s + fz * c) * speed * (wantMove ? 1 : 0);
    const acc = wantMove ? 9 : 11;
    this.vel.x = damp(this.vel.x, tx, acc, dt); this.vel.y = damp(this.vel.y, tz, acc, dt);
    const ox = this.pos.x, oz = this.pos.z;
    this.pos.x += this.vel.x * dt; this.pos.z += this.vel.y * dt;
    this.world.collide(this.pos, this.radius);
    const moved = Math.hypot(this.pos.x - ox, this.pos.z - oz);
    this.distance += moved;
    this.moving = moved / Math.max(dt, 1e-4);
    // ---- stamina ----
    if (this.running && this.moving > 2.5) { this.stamina -= dt * 0.14; this.staminaDelay = 0.9; if (this.stamina <= 0) { this.stamina = 0; this.exhausted = true; } }
    else { this.staminaDelay -= dt; if (this.staminaDelay <= 0) this.stamina = Math.min(1, this.stamina + dt * (this.moving < 0.3 ? 0.17 : 0.11)); }
    if (this.exhausted && this.stamina > 0.38) this.exhausted = false;
    // ---- crouch ----
    this.crouchT = damp(this.crouchT, this.crouching ? 1 : 0, 10, dt);
    // ---- footsteps / bob ----
    const stepLen = this.running ? 0.95 : this.crouching ? 0.55 : 0.72;
    this.stepPhase += moved / stepLen;
    if (this.stepPhase >= 1) {
      this.stepPhase -= 1; this.lastStepSide ^= 1;
      if (this.onStep) this.onStep(this.running, this.crouching);
    }
    this.noise = this.moving < 0.2 ? 0 : this.running ? 17 : this.crouching ? 2.2 : 7;
    // ---- battery ----
    if (this.flash || this.nv) { this.battery -= dt * ((this.flash ? 1 / 560 : 0) + (this.nv ? 1 / 330 : 0)); }
    if (this.battery <= 0) { this.battery = 0; this.flash = false; this.nv = false; }
    // ---- camera ----
    this.vYaw = damp(this.vYaw, this.yaw, 26, dt); this.vPitch = damp(this.vPitch, this.pitch, 26, dt);
    let yaw = this.vYaw, pitch = this.vPitch, roll = 0;
    const t = this.t;
    const runK = this.running ? 1 : 0;
    const mv = clamp(this.moving / 4.8, 0, 1);
    const bobA = (0.028 + runK * 0.04) * mv * (1 - this.crouchT * 0.5);
    const ph = (this.stepPhase + this.lastStepSide) * Math.PI;
    const bobY = Math.abs(Math.sin(ph)) * bobA * 1.4 - bobA * 0.7;
    const bobX = Math.cos(ph) * bobA * 0.9;
    // handheld drift (always a little alive) + fear/shake
    const hh = 0.0045 + this.fear * 0.006 + (1 - this.sanity) * 0.004;
    yaw += (Math.sin(t * 0.71) * 0.6 + Math.sin(t * 1.93 + 1.3) * 0.4) * hh;
    pitch += (Math.sin(t * 0.83 + 2.1) * 0.6 + Math.sin(t * 2.31) * 0.4) * hh + bobY * 0.12;
    roll += (Math.sin(t * 0.57 + 0.4) * 0.012 + bobX * 0.35) + Math.sin(t * 0.37) * (1 - this.sanity) * 0.03;
    if (this.shake > 0) { yaw += (Math.random() - 0.5) * this.shake * 0.05; pitch += (Math.random() - 0.5) * this.shake * 0.05; roll += (Math.random() - 0.5) * this.shake * 0.04; this.shake = Math.max(0, this.shake - dt * 2.5); }
    if (this.forcedLook) {
      const f = this.forcedLook; const dx = f.x - this.pos.x, dz = f.z - this.pos.z; const ty = Math.atan2(-dx, -dz);
      const tp = Math.atan2(f.y - (this.eye - this.crouchT * 0.55), Math.hypot(dx, dz));
      this.yaw = this.vYaw = this.yaw + angDiff(this.yaw, ty) * Math.min(1, f.k * dt); this.pitch = this.vPitch = lerp(this.pitch, tp, Math.min(1, f.k * dt));
      yaw = this.vYaw; pitch = this.vPitch;
    }
    const eyeH = this.eye - this.crouchT * 0.55 + bobY + (ctl && ctl.eyeOffset ? ctl.eyeOffset : 0);
    const sx = Math.cos(yaw), sz = -Math.sin(yaw);
    this.cam.position.set(this.pos.x + sx * bobX * 0.5, eyeH, this.pos.z + sz * bobX * 0.5);
    this.cam.rotation.set(pitch, yaw, roll, 'YXZ');
    this.cam.updateMatrixWorld();
  }
  forward(out) { return out.set(-Math.sin(this.yaw), 0, -Math.cos(this.yaw)); }
}

// =====================================================================
//  The entity ("それ"): procedural model, animation and senses
// =====================================================================
function capsule(r, len, mat, seg = 6) {
  const g = new THREE.CapsuleGeometry(r, len, 3, seg); g.translate(0, -len / 2 - r * 0.3, 0);

class Dust {
  constructor(scene) {
    const N = 700; const pos = new Float32Array(N * 3); const sd = new Float32Array(N);
    for (let i = 0; i < N; i++) { pos[i * 3] = Math.random(); pos[i * 3 + 1] = Math.random(); pos[i * 3 + 2] = Math.random(); sd[i] = Math.random(); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('aSeed', new THREE.BufferAttribute(sd, 1));
    this.mat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: Object.assign({}, G, { uAmb: { value: 0 }, uBox: { value: new THREE.Vector3(9, 3.2, 9) }, uPx: { value: 1 } }),
      vertexShader: /* glsl */`
        in float aSeed; uniform float uTime; uniform vec3 uCam; uniform vec3 uBox; uniform float uPx;
        uniform vec3 uFlPos; uniform vec3 uFlDir; uniform float uFlOn; uniform float uIR; uniform float uAmb;
        out float vB;
        void main(){
          vec3 drift = vec3(sin(uTime * 0.11 + aSeed * 40.0) * 0.25 + uTime * 0.018, sin(uTime * 0.07 + aSeed * 13.0) * 0.12 - uTime * 0.006, cos(uTime * 0.09 + aSeed * 27.0) * 0.25 + uTime * 0.011);
          vec3 p = position * uBox + drift;
          vec3 base = uCam - uBox * 0.5; base.y = 0.15;
          vec3 wp = base + mod(p - base, uBox);
          vec4 mv = viewMatrix * vec4(wp, 1.0);
          float d = -mv.z;
          vec3 L = wp - uFlPos; float ld = length(L);
          float cone = smoothstep(0.86, 0.96, dot(L / max(ld, 1e-3), uFlDir)) / (1.0 + 0.3 * ld * ld);
          vB = (uFlOn * cone * 1.6 + uIR * cone * 0.5 + uAmb) * smoothstep(0.25, 0.7, d) * (1.0 - smoothstep(3.0, 4.4, d)) * (0.4 + 0.6 * fract(aSeed * 7.31));
          gl_PointSize = clamp(9.0 * uPx / max(d, 0.1), 1.0, 6.0);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        precision highp float; in float vB; out highp vec4 fragColor;
        void main(){ vec2 c = gl_PointCoord - 0.5; float a = smoothstep(0.5, 0.1, length(c)); if (vB * a < 0.002) discard; fragColor = vec4(vec3(1.0, 0.94, 0.8) * vB * a, 1.0); }`,
    });
    this.points = new THREE.Points(geo, this.mat); this.points.frustumCulled = false; this.points.renderOrder = 5;
    scene.add(this.points);
  }
  update(light) { this.mat.uniforms.uAmb.value = Math.min(0.09, light * 0.035); this.mat.uniforms.uPx.value = window.innerHeight / 540; }
}

}

// =====================================================================
//  UI: camcorder OSD, VCR menus, title
// =====================================================================
class UI {
  constructor(game) {

    setInterval(() => { const d = new Date(); $('mClock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }, 1000);
  }
  _set(key, el, prop, v) { if (this.cache[key] !== v) { this.cache[key] = v; el[prop] = v; } }

  playLog(i) {

    this.ui.clearSubs();
    this.ui.subtitle([{ text: `▶ LOG ${i + 1}　${L.date}`, dur: 1.8, gap: 0.5 }, ...L.lines.map(l => ({ text: l, dur: Math.max(2.6, l.length * 0.14), gap: 0.45 }))]);

        { // keep the faceless head right in the lens

          const hw2 = E.headWorld(this.tmpV); P.forcedLook = { x: hw2.x, y: hw2.y, z: hw2.z, k: 18 };

        break;
      }

  _updateFrustum() { this.camera.updateMatrixWorld(); this.projM.multiplyMatrices(this.camera.projectionMatrix, this.camera.matrixWorldInverse); this.frustum.setFromProjectionMatrix(this.projM); }

    if (E.active && E.state !== 'off') { if (E.seenByPlayer) ds -= 0.035 * E.seenByPlayer; if (E.dist < 10) ds -= 0.012; }
    if (this.director.loop) ds -= 0.01;
    P.sanity = clamp(P.sanity + ds * dt, 0.05, ds > 0 ? Math.max(P.sanity, 0.85) : 1);
  }
  _feedRender(dt) {
    const P = this.player, W = this.world, E = this.entity, fx = this.fx, cam = this.camera;
    const f = this.fwd.set(0, 0, -1).applyQuaternion(cam.quaternion);
    // global uniforms
    G.uCam.value.copy(cam.position);
    const right = this.tmpV.set(1, 0, 0).applyQuaternion(cam.quaternion);
    G.uFlPos.value.copy(cam.position).addScaledVector(right, 0.16); G.uFlPos.value.y -= 0.14;
    G.uFlDir.value.copy(f);
    const lowBat = P.battery < 0.12;
    const flick = lowBat && P.flash ? (Math.sin(this.t * 37) * Math.sin(this.t * 13.7) > 0.6 ? 0.25 : 1) : 1;
    G.uFlOn.value = damp(G.uFlOn.value, P.flash ? flick : 0, 30, dt);
    G.uIR.value = P.nv ? 1 : 0;
    G.uRestMul.value = W.power;
    // light around the player -> AGC, fog, hum
    const hx = f.x, hz = f.z; const hl = Math.hypot(hx, hz) || 1;
    const L0 = W.lightAt(P.pos.x, P.pos.z);
    let Lv = L0 * 0.4; let wsum = 0.4;
    for (const d of [2, 5, 9]) { const x = P.pos.x + hx / hl * d, z = P.pos.z + hz / hl * d; if (!W.segBlocked(P.pos.x, P.pos.z, x, z)) { Lv += W.lightAt(x, z) * 0.3; wsum += 0.3; } }
    Lv /= wsum; this.lightAtPlayer = L0;
    const lookDown = clamp(-f.y, 0, 1);
    const front = Math.min(W.rayFree(P.pos.x, P.pos.z, hx / hl, hz / hl, 12) + 0.3, 1.62 / Math.max(0.12, lookDown));
    const flashK = G.uFlOn.value * 2.3 / (1 + 0.06 * front * front);
    const irK = P.nv ? 0.9 / (1 + 0.05 * front * front) : 0;
    const sceneL = Lv * 0.6 + flashK * 0.45 + irK * 0.5 + 0.01;
    let gainT = clamp(0.33 / sceneL, 0.28, 3.2);
    if (P.nv) gainT = clamp(0.5 / sceneL, 0.6, 4.5);
    this.gain = damp(this.gain, gainT, this.gain > gainT ? 2.5 : 1.1, dt);
    const fogK = clamp(Lv / 1.4, 0.02, 1);
    G.uFogCol.value.setRGB(0.15 * fogK, 0.13 * fogK, 0.065 * fogK);
    // objective signal
    const D = this.director; let sig = 0, interf = 0;
    if (D.target) { const dx = D.target.x - P.pos.x, dz = D.target.z - P.pos.z; const d = Math.hypot(dx, dz); const a = Math.max(0, (dx * hx + dz * hz) / (d * hl + 1e-6)); const near = clamp(1 - d / 85, 0, 1); sig = near * near * (0.2 + 0.8 * a * a) + 0.17 * Math.pow(a, 6) * (d > 40 ? 1 : 0); if (d < 8) interf += (1 - d / 8) * 0.25; }
    this.signal = damp(this.signal, sig, 4, dt);
    if (E.active && E.dist < 22) interf += (1 - E.dist / 22) * 0.7 * E.agg;
    fx.interfKick = Math.max(0, fx.interfKick - dt * 1.2);
    interf += fx.interfKick;
    // fear
    let fearT = 0;
    if (E.active) { if (E.state === 'chase') fearT = 1; else if (E.dist < 18) fearT = 0.25 + (E.seenByPlayer ? 0.4 : 0); }
    fearT = Math.max(fearT, (1 - P.sanity) * 0.5);
    this.fear = damp(this.fear, fearT, fearT > this.fear ? 3 : 0.4, dt); P.fear = this.fear;
    // sanity warp
    this.sanityWarp = damp(this.sanityWarp, smooth(0.6, 0.12, P.sanity), 1, dt);
    G.uWarp.value = this.sanityWarp * Settings.fx;
    fx.shock = Math.max(0, fx.shock - dt * 1.3);
    // post uniforms
    const U = this.post.U;
    U.uTime.value = this.t; U.uGain.value = this.gain; U.uNV.value = P.nv ? 1 : 0; U.uInterf.value = clamp(interf, 0, 1.2); U.uWarp.value = this.sanityWarp;
    U.uFx.value = Settings.fx; U.uBlack.value = clamp(fx.black, 0, 1); U.uStatic.value = clamp(fx.static, 0, 1); U.uShock.value = Math.min(1, fx.shock); U.uWhite.value = fx.white;
    // flicker clicks near the player
    this._lightClicks();
  }
  _lightClicks() {
    const P = this.player, W = this.world; const gi0 = Math.floor(P.pos.x / 3), gj0 = Math.floor(P.pos.z / 3);
    let flickering = 0;
    for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) {
      const gi = gi0 + di, gj = gj0 + dj; const I = W.lightIntensityAt(gi, gj); const k = gi + ',' + gj;
      const prev = this.lightMem.get(k); this.lightMem.set(k, I);
      if (prev === undefined) continue;
      const on = I > 0.25, was = prev > 0.25;
      if (on !== was) { flickering++; if (this.state === 'play' || this.state === 'title') this.sound.lightClick({ x: gi * 3 + 1.5, y: W.ceilingAt(gi * 3 + 1.5, gj * 3 + 1.5), z: gj * 3 + 1.5 }, !on); }
    }
    if (this.lightMem.size > 400) this.lightMem.clear();
    this.flickerNear = damp(this.flickerNear || 0, Math.min(1, flickering), 6, 1 / 60);
  }
  _soundState(paused) {
    const P = this.player, W = this.world, z = W.zoneAt(P.pos.x, P.pos.z);
    const ex = this.items.exit; const exitD = ex ? Math.hypot(ex.x - P.pos.x, ex.z - P.pos.z) : 99;
    return {
      camPos: this.camera.position, camFwd: this.fwd, light: this.lightAtPlayer || 0.5, power: W.power, flickerNear: this.flickerNear || 0,
      exitQuiet: smooth(3, 22, exitD), fear: this.fear, stamina: P.stamina, holdBreath: P.crouching && this.fear > 0.3,
      reverb: z === ZONE.VOID ? 0.8 : z === ZONE.PILLARS ? 0.6 : z === ZONE.OFFICES ? 0.18 : z === ZONE.CORRIDOR ? 0.4 : 0.3,
      signal: this.signal, interf: this.post.U.uInterf.value, tapePlaying: this.tapePlaying,
      paused: paused || this.state === 'dead' || (this.state === 'ending' && this.stateT > 3),
    };
  }
}

const game = new Game();
window.__game = {
  game,
  start() { game.sound.init(); game.startGame(); },
  state() { return game.state; },
  ready() { return game.state === 'play' && game.world.pending.size === 0; },
  tp(x, z, yaw = 0, pitch = 0) { const s = game.world.snapFree(x, z, 6, 1) || { x, z }; game.player.reset(s.x, s.z, yaw); game.player.pitch = game.player.vPitch = pitch; return s; },
  look(yaw, pitch = 0) { game.player.yaw = game.player.vYaw = yaw; game.player.pitch = game.player.vPitch = pitch; },
  set(k, v) { game.player[k] = v; },
  info() {
    const P = game.player, E = game.entity, D = game.director, R = game.renderer.info.render;
    return { state: game.state, x: +P.pos.x.toFixed(2), z: +P.pos.z.toFixed(2), zone: game.world.zoneAt(P.pos.x, P.pos.z), light: +(game.lightAtPlayer || 0).toFixed(2), gain: +game.gain.toFixed(2),
      chunks: game.world.chunks.size, pending: game.world.pending.size, phase: D.phase, tapes: D.tapes, target: D.target, entity: E.state, edist: E.dist && +E.dist.toFixed(1), sanity: +P.sanity.toFixed(2), signal: +game.signal.toFixed(2), loop: !!D.loop, items: game.items.list.length, calls: R.calls, tris: R.triangles };
  },
  findZone(zone) { // nearest loaded chunk centre with that zone
    let best = null; for (const c of game.world.chunks.values()) if (c.info.zone === zone) { const d = Math.hypot(c.X0 + 12 - game.player.pos.x, c.Z0 + 12 - game.player.pos.z); if (!best || d < best.d) best = { d, x: c.X0 + 12, z: c.Z0 + 12, cx: c.cx, cz: c.cz }; } return best;
  },
  spawnEntity(state, dist = 8) { const P = game.player; const f = P.forward(new THREE.Vector3()); const s = game.world.snapFree(P.pos.x + f.x * dist, P.pos.z + f.z * dist, 4, 1); if (!s) return null; game.entity.spawn(s.x, s.z, state, Math.atan2(P.pos.x - s.x, P.pos.z - s.z)); if (state === 'chase') game.entity.lastKnown = { x: P.pos.x, z: P.pos.z }; return s; },
  giveTape() { const D = game.director; if (D.target && D.target.type === 'tape') { if (D.tapeObj) game.items.remove(D.tapeObj); D.onTape(D.tapes + 1); return D.tapes; } return -1; },
  bigScare() { game.director.scareAt = game.t; },
  fx: game.fx, input: Input,
  audio() { return { state: game.sound.ctx && game.sound.ctx.state, level: game.sound.level() }; },
  reach(x, z) { const f = game.entity; f._computeField(x, z); return f.pathDist(game.player.pos.x, game.player.pos.z); },
  perf() { const P = game._perf || []; return P.length ? (P.reduce((a, b) => a + b, 0) / P.length).toFixed(2) + 'ms avg, max ' + Math.max(...P).toFixed(2) : 'n/a'; },
  rearrange() { const before = [...game.world.chunks.values()].map(c => c.variant).reduce((a, b) => a + b, 0); game.director._rearrange(); return before; },
};
